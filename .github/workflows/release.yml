name: release
on:
  push:
    branches: [main]

permissions: {}

jobs:
  # Opens/updates the "Release" PR carrying the version bump and changelog.
  # Nothing is published by this job — the PR is the last reviewable point
  # before anything reaches crates.io.
  release-pr:
    name: release-pr
    runs-on: ubuntu-latest
    if: github.repository == 'justland/just-func-rust'
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-pr-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Publishes any crate whose version is not yet on crates.io. Runs on the push
  # produced by merging the release PR above. Authenticates with crates.io
  # Trusted Publishing (OIDC) — there is no CARGO_REGISTRY_TOKEN to rotate.
  release:
    name: release
    runs-on: ubuntu-latest
    if: github.repository == 'justland/just-func-rust'
    permissions:
      contents: write
      pull-requests: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
